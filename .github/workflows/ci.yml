name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Model metadata is generated locally and intentionally ignored by git.
      - run: npm run hydrate:model-data
      # This standalone example has its own dependency manifest.
      - run: npm ci --ignore-scripts
        working-directory: packages/coding-agent/examples/extensions/with-deps
      - name: Build upstream runtime and trading packages
        run: |
          npm --prefix packages/tui run build
          npm --prefix packages/telemetry run build
          npm --prefix packages/ai run build:offline
          npm --prefix packages/agent run build
          npm --prefix packages/protocol run build
          npm --prefix packages/client run build
          npm --prefix packages/coding-agent run build:unbundled
          npm --prefix packages/trading-risk run build
          npm --prefix packages/trading-engine run build
          npm --prefix packages/triggers run build
          npm --prefix packages/trading-agent run build
      - name: Verify trading package contents
        run: |
          npm pack --dry-run --json --workspace packages/trading-risk > /tmp/ti-trading-risk-pack.json
          npm pack --dry-run --json --workspace packages/trading-engine > /tmp/ti-trading-engine-pack.json
          node -e 'const fs = require("node:fs"); for (const name of ["trading-risk", "trading-engine"]) { const pack = JSON.parse(fs.readFileSync(`/tmp/ti-${name}-pack.json`, "utf8")); const files = pack.flatMap((entry) => entry.files.map((file) => file.path)); const tests = files.filter((file) => /\.test\.(js|d\.ts|js\.map)$/.test(file)); if (tests.length > 0) { console.error(`${name} package contains test modules: ${tests.join(", ")}`); process.exit(1); } }'
          npm pack --dry-run --json --workspace packages/trading-agent > /tmp/ti-trading-agent-pack.json
      - run: npm run check
      - name: Run isolated trading readiness gates
        run: node scripts/trading-readiness.mjs --report "$RUNNER_TEMP/ti-offline-readiness.json"
      - name: Test market-chart extension
        run: node node_modules/vitest/dist/cli.js --run extensions/market-chart --config extensions/market-chart/vitest.config.ts
      - name: Install native search tools for coding-agent tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - run: ./test.sh
      - name: Run trading-agent runtime smoke checks
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          TI_DATA_DIR="$smoke_dir" npm run smoke --workspace=ti-trader
      - name: Verify npm package contents
        working-directory: packages/trading-agent
        run: npm pack --dry-run

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
